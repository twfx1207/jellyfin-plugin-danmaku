name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Jellyfin ${{ matrix.jellyfin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - jellyfin: "10.11.11"
            framework: net9.0
          - jellyfin: "12"
            framework: net10.0
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check web client syntax
        run: node --check Web/client.js

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Danmaku.slnx

      - name: Build
        run: dotnet build Jellyfin.Plugin.Danmaku.csproj --configuration Release --framework ${{ matrix.framework }} --no-restore
